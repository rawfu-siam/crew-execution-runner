services:
  crew-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crew-execution-runner
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/crew_runner.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - crew_data:/app/data
      - crew_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  crew_data:
  crew_logs:
